<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kotoha AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-page">
  <aside class="sidebar">
    <a class="logo" href="index.html">Kotoha AI</a>
    <button id="new-chat" class="button primary full">＋ 新しいチャット</button>
    <nav id="conversation-list" class="conversation-list"></nav>
    <div class="sidebar-footer">
      <span id="usage-summary">利用状況を読み込み中…</span>
      <button id="signout-button" class="text-button">ログアウト</button>
    </div>
  </aside>
  <main class="chat-main">
    <header class="chat-header">
      <div>
        <h1 id="conversation-title">新しいチャット</h1>
        <p id="worker-status" class="composer-note" role="status" aria-live="polite">読み込みを開始しています…</p>
      </div>
    </header>
    <section id="message-list" class="message-list" aria-live="polite"></section>
    <form id="chat-form" class="composer">
      <textarea id="message-input" rows="1" placeholder="Kotoha AIに質問…" required></textarea>
      <button id="send-button" class="button primary" type="submit">送信</button>
    </form>
    <p class="composer-note">ログイン認証とサーバー接続を確認します。</p>
  </main>
  <script src="js/config.js?v=2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/chat.js?v=3"></script>
</body>
</html>
