<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kotoha AI</title>
  <link rel="stylesheet" href="css/style.css?v=9" />
  <style>
    .composer{padding:12px 24px 4px;display:block}
    .composer-box{width:min(100%,900px);margin:0 auto;border:1px solid var(--border);background:var(--panel);border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.18);padding:10px 12px 8px}
    .composer textarea{display:block;width:100%;min-height:54px;max-height:180px;resize:none;border:0;background:transparent;box-shadow:none;border-radius:12px;padding:8px 8px 4px;font-size:1rem;line-height:1.55}
    .composer textarea:focus{border:0;box-shadow:none}
    .composer-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
    .composer-left{display:flex;align-items:center;min-width:0}
    .model-picker{display:flex;align-items:center;gap:6px;width:auto;color:var(--muted);font-size:.76rem}
    .model-picker-label{white-space:nowrap}
    .model-picker select{width:170px;min-width:0;padding:6px 28px 6px 9px;border-radius:8px;font-size:.8rem;background:rgba(255,255,255,.035)}
    .send-button{width:34px;height:34px;min-width:34px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#071020;font-size:1.05rem;font-weight:900;cursor:pointer;transition:transform .15s ease,opacity .15s ease}
    .send-button:hover{transform:translateY(-1px)}
    .send-button:disabled{opacity:.45;cursor:wait;transform:none}
    .message{max-width:860px;line-height:1.7}
    .message-content{margin:8px 0 0;overflow-wrap:anywhere}
    .message-content p{margin:0 0 .75em}.message-content p:last-child{margin-bottom:0}
    .message-content h1,.message-content h2,.message-content h3,.message-content h4,.message-content h5,.message-content h6{margin:1em 0 .45em;line-height:1.3}
    .message-content h1{font-size:1.45rem}.message-content h2{font-size:1.3rem}.message-content h3{font-size:1.15rem}
    .message-content ul,.message-content ol{margin:.5em 0 .8em;padding-left:1.5em}.message-content li{margin:.25em 0}
    .message-content blockquote{margin:.75em 0;padding:.55em .9em;border-left:3px solid var(--accent);color:var(--muted);background:rgba(124,156,255,.05);border-radius:0 8px 8px 0}
    .message-content code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em;background:rgba(255,255,255,.07);padding:.12em .35em;border-radius:5px}
    .message-content pre{margin:.8em 0;padding:14px;overflow:auto;background:#08101d;border:1px solid var(--border);border-radius:10px}
    .message-content pre code{display:block;background:transparent;padding:0;white-space:pre;font-size:.88rem}
    .message-content a{color:var(--accent-2);text-decoration:underline}
    .message[data-streaming="true"] .message-content{min-height:1.4em}
    @media(max-width:760px){.composer{padding:8px 10px 3px}.composer-box{border-radius:16px;padding:8px 10px 7px}.composer textarea{min-height:48px;font-size:.96rem}.model-picker select{width:150px;font-size:.78rem}.send-button{width:32px;height:32px;min-width:32px}.composer-note{margin-bottom:8px}}
  </style>
</head>
<body class="app-page">
  <aside class="sidebar">
    <a class="logo" href="index.html">Kotoha AI</a>
    <button id="new-chat" class="button primary full">＋ 新しいチャット</button>
    <nav id="conversation-list" class="conversation-list"></nav>
    <div class="sidebar-footer">
      <span id="usage-summary">利用状況を読み込み中…</span>
      <button id="signout-button" class="text-button" type="button">ログアウト</button>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <div>
        <h1 id="conversation-title">新しいチャット</h1>
        <p id="worker-status" class="composer-note" role="status" aria-live="polite">読み込みを開始しています…</p>
      </div>
    </header>

    <section id="message-list" class="message-list" aria-live="polite"></section>

    <form id="chat-form" class="composer">
      <div class="composer-box">
        <textarea id="message-input" rows="1" placeholder="Kotoha AIに質問…" required></textarea>
        <div class="composer-toolbar">
          <div class="composer-left">
            <label class="model-picker" for="model-select">
              <span class="model-picker-label">モデル</span>
              <select id="model-select">
                <option value="@cf/google/gemma-4-26b-a4b-it">Gemma 4 26B · 5回/日</option>
                <option value="@cf/meta/llama-3.2-1b-instruct">Llama 3.2 1B · 10回/日</option>
              </select>
            </label>
          </div>
          <button id="send-button" class="send-button" type="submit" aria-label="送信" title="送信">↑</button>
        </div>
      </div>
    </form>

    <p class="composer-note">Markdown対応 · 回答は生成された部分からリアルタイムに表示されます。</p>
  </main>

  <script src="js/config.js?v=5"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=5"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/chat.js?v=8"></script>
</body>
</html>
