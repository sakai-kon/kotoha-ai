<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン | Kotoha AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="back-link" href="index.html">← ホームへ戻る</a>
      <p class="eyebrow">KOTOHA AI</p>
      <h1>ログイン</h1>
      <p class="muted">一般ユーザーはKotoha AI IDでログインできます。管理者はGitHubでログインしてください。</p>

      <form id="auth-form" class="stack">
        <label>Kotoha AI ID<input id="username" type="text" autocomplete="username" minlength="3" maxlength="32" required /></label>
        <label>パスワード<input id="password" type="password" autocomplete="current-password" minlength="8" required /></label>
        <button id="password-login-button" class="button primary" type="submit">ログイン</button>
      </form>

      <div class="auth-divider"><span>または</span></div>
      <button id="github-login-button" class="button secondary full" type="button">GitHubでログイン（管理者）</button>
      <p id="auth-status" class="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
